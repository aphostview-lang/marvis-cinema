<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Marvis Cinema - 自用影视</title>
<!-- hls.js CDN：用于播放 m3u8 直播/切片流（jsdelivr 失败自动回退国内/备用 CDN） -->
<script src="https://cdn.jsdelivr.net/npm/hls.js@1" onerror="loadHlsFallback()"></script>
<script>
function loadHlsFallback(){
  if(window.Hls) return;
  var urls=["https://cdn.bootcdn.net/ajax/libs/hls.js/1.5.13/hls.min.js","https://unpkg.com/hls.js@1/dist/hls.min.js"];
  var i=0;
  (function next(){
    if(i>=urls.length||window.Hls) return;
    var s=document.createElement("script");
    s.src=urls[i++];
    s.onload=function(){ if(!window.Hls) next(); };
    s.onerror=next;
    document.head.appendChild(s);
  })();
}
document.addEventListener("DOMContentLoaded", function(){ if(!window.Hls) loadHlsFallback(); });
</script>
<style>
/* ============ 全局样式（奈飞风格深色 UI） ============ */
*{ margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
:root{
  --red:#E50914;
  --bg:#141414;
  --bg2:#1c1c1c;
  --bg3:#242424;
  --text:#fff;
  --muted:#a3a3a3;
  --star:#f5c518;
}
html,body{ background:var(--bg); color:var(--text); font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif; font-size:16px; }
body{ min-height:100vh; padding-bottom:60px; }
a{ color:inherit; text-decoration:none; }
img{ display:block; }
button{ font-family:inherit; cursor:pointer; border:none; background:none; color:inherit; }
input{ font-family:inherit; }
::-webkit-scrollbar{ width:8px; height:8px; }
::-webkit-scrollbar-thumb{ background:#333; border-radius:4px; }
::-webkit-scrollbar-track{ background:transparent; }

/* ============ 顶部导航 ============ */
#topbar{
  position:fixed; top:0; left:0; right:0; z-index:100;
  display:flex; align-items:center; gap:20px;
  padding:0 3vw; height:64px;
  background:linear-gradient(180deg, rgba(0,0,0,.85) 0%, rgba(20,20,20,.6) 70%, transparent 100%);
}
#topbar.scrolled{ background:#141414; box-shadow:0 2px 12px rgba(0,0,0,.5); }
.logo{ font-size:24px; font-weight:900; color:var(--red); letter-spacing:1px; white-space:nowrap; cursor:pointer; outline:none; }
.logo span{ color:#fff; font-weight:600; }
.nav{ display:flex; gap:4px; }
.nav button{
  padding:8px 14px; border-radius:6px; font-size:15px; color:#e5e5e5; white-space:nowrap; outline:none;
}
.nav button:hover{ color:#fff; }
.nav button.active{ color:#fff; font-weight:700; }
.nav button.focused{ outline:2px solid #fff; }
#searchBox{
  margin-left:auto; display:flex; align-items:center; gap:6px;
  background:rgba(255,255,255,.08); border:1px solid rgba(255,255,255,.15);
  border-radius:6px; padding:0 12px; height:36px; width:230px; transition:width .3s, background .3s;
}
#searchBox:focus-within{ background:#fff; width:300px; }
#searchBox:focus-within #searchInput{ color:#000; }
#searchInput{ flex:1; background:none; border:none; outline:none; color:#fff; font-size:14px; }
#searchInput::placeholder{ color:#a3a3a3; }
#searchBox:focus-within #searchInput::placeholder{ color:#666; }
#searchBtn{ color:#e5e5e5; font-size:16px; line-height:1; }
#settingsBtn{ font-size:20px; color:#e5e5e5; line-height:1; padding:6px; outline:none; }
#settingsBtn:hover{ color:#fff; transform:rotate(30deg); transition:transform .4s; }
#hamburger{ display:none; font-size:24px; color:#fff; }
#mobileNav{
  display:none; position:fixed; top:64px; left:0; right:0; z-index:99;
  background:rgba(20,20,20,.98); flex-direction:column; padding:8px 0; box-shadow:0 6px 20px rgba(0,0,0,.6);
}
#mobileNav.show{ display:flex; }
#mobileNav button{ padding:14px 24px; font-size:16px; text-align:left; color:#e5e5e5; border-bottom:1px solid #222; }
#mobileNav button.active{ color:var(--red); font-weight:700; }

/* ============ 电视端提示条 ============ */
#tvHint{
  position:fixed; top:70px; left:50%; transform:translateX(-50%); z-index:90;
  background:rgba(0,0,0,.75); border:1px solid rgba(255,255,255,.2); border-radius:8px;
  padding:10px 18px; font-size:14px; color:#e5e5e5; display:flex; align-items:center; gap:12px; white-space:nowrap;
}
#tvHint .close{ color:#fff; font-size:16px; padding:2px 8px; border-radius:4px; }
#tvHint .close:hover{ background:rgba(255,255,255,.15); }

/* ============ 页面容器 ============ */
.page{ display:none; padding-top:64px; }
.page.active{ display:block; }
.container{ padding:24px 3vw; }
.section-title{ font-size:22px; font-weight:700; margin:26px 0 14px; }
#searchPage .search-stat{ color:var(--muted); font-size:14px; margin-bottom:14px; }

/* ============ Hero 大横幅 ============ */
.hero{
  position:relative; height:min(70vh, 600px); min-height:420px;
  background-size:cover; background-position:center top;
  display:flex; align-items:flex-end; overflow:hidden;
}
.hero::after{ content:""; position:absolute; inset:0; background:linear-gradient(180deg, rgba(20,20,20,.25) 0%, rgba(20,20,20,.1) 40%, rgba(20,20,20,.92) 88%, #141414 100%); }
.hero-inner{ position:relative; z-index:2; padding:0 3vw 56px; max-width:1200px; }
.hero-badge{ display:inline-block; background:var(--red); font-size:12px; font-weight:700; padding:4px 10px; border-radius:4px; margin-bottom:12px; }
.hero-title{ font-size:clamp(30px,4.5vw,60px); font-weight:900; margin-bottom:10px; text-shadow:0 2px 16px rgba(0,0,0,.6); }
.hero-meta{ color:#e5e5e5; font-size:15px; margin-bottom:12px; display:flex; gap:14px; flex-wrap:wrap; align-items:center; }
.hero-overview{ max-width:560px; color:#ccc; font-size:15px; line-height:1.6; margin-bottom:22px; display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.hero-btns{ display:flex; gap:12px; flex-wrap:wrap; }
.btn{
  display:inline-flex; align-items:center; gap:8px; padding:10px 26px; border-radius:6px;
  font-size:16px; font-weight:700; transition:transform .15s, background .2s; outline:none;
}
.btn:active{ transform:scale(.96); }
.btn-play{ background:#fff; color:#000; }
.btn-play:hover{ background:#e5e5e5; }
.btn-info{ background:rgba(109,109,110,.55); color:#fff; }
.btn-info:hover{ background:rgba(109,109,110,.75); }
.btn-red{ background:var(--red); color:#fff; }
.btn-red:hover{ background:#f6121d; }

/* ============ 横向滚动内容行 ============ */
.row{ margin:0 3vw; }
.row-title{ font-size:20px; font-weight:700; margin:24px 0 12px; display:flex; align-items:center; gap:10px; }
.row-title .count{ font-size:13px; color:var(--muted); font-weight:400; }
.row-scroll{
  display:flex; gap:10px; overflow-x:auto; scroll-behavior:smooth;
  padding:8px 4px 16px; scroll-snap-type:x proximity;
}
.row-scroll::-webkit-scrollbar{ height:5px; }

/* ============ 卡片 ============ */
.card{
  flex:0 0 auto; width:160px; position:relative; cursor:pointer;
  border-radius:8px; overflow:hidden; background:var(--bg2);
  transition:transform .25s, box-shadow .25s; scroll-snap-align:start;
  outline:2px solid transparent; outline-offset:2px;
}
.card:hover{ transform:scale(1.08); z-index:5; box-shadow:0 10px 30px rgba(0,0,0,.7); }
.card.focused{ transform:scale(1.08); z-index:5; outline:2px solid #fff; box-shadow:0 10px 30px rgba(0,0,0,.7); }
.card .poster{ aspect-ratio:2/3; width:100%; background-size:cover; background-position:center; position:relative; display:flex; align-items:flex-end; }
.card .grad-ph{ width:100%; height:100%; display:flex; align-items:center; justify-content:center; font-size:38px; font-weight:900; color:rgba(255,255,255,.4); }
.card .fav{
  position:absolute; top:6px; right:6px; z-index:3; width:30px; height:30px;
  border-radius:50%; background:rgba(0,0,0,.45); color:#fff; font-size:15px;
  display:flex; align-items:center; justify-content:center; line-height:1;
}
.card .fav.on{ color:var(--red); }
.card .card-info{ padding:8px 6px 10px; }
.card .card-title{ font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.card .card-sub{ font-size:12px; color:var(--muted); margin-top:3px; display:flex; align-items:center; gap:6px; }
.star{ color:var(--star); font-size:12px; }
.badge-type{ font-size:10px; padding:1px 6px; border-radius:3px; background:rgba(255,255,255,.14); }
.badge-tv{ background:rgba(229,9,20,.7); }

/* ============ 网格（分类页 / 搜索页 / 收藏页） ============ */
.grid{ display:grid; gap:16px 12px; grid-template-columns:repeat(auto-fill, minmax(150px,1fr)); }
@media (max-width:640px){ .grid{ grid-template-columns:repeat(2,1fr); gap:12px 10px; } }
@media (min-width:1200px){ .grid{ grid-template-columns:repeat(auto-fill, minmax(180px,1fr)); } }
.grid .card{ width:100%; }

/* ============ 空状态 / 加载 ============ */
.empty{ text-align:center; color:var(--muted); padding:80px 20px; font-size:15px; }
.loading{ text-align:center; color:var(--muted); padding:80px 20px; }
.spinner{ display:inline-block; width:36px; height:36px; border:3px solid #333; border-top-color:var(--red); border-radius:50%; animation:spin 1s linear infinite; }
@keyframes spin{ to{ transform:rotate(360deg); } }

/* ============ 详情弹层 ============ */
#detailOverlay{ position:fixed; inset:0; z-index:200; display:none; background:rgba(0,0,0,.6); overflow-y:auto; }
#detailOverlay.open{ display:block; }
#detailBox{ width:100%; min-height:100%; background:var(--bg); position:relative; }
.detail-backdrop{ height:min(50vh,440px); background-size:cover; background-position:center top; position:relative; display:flex; align-items:flex-end; }
.detail-backdrop .backdrop-img{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; z-index:0; }
.detail-backdrop::after{ content:""; position:absolute; inset:0; z-index:1; background:linear-gradient(180deg, rgba(20,20,20,.15), rgba(20,20,20,.95) 85%); }
.detail-backdrop .back-btn{
  position:absolute; top:20px; left:20px; z-index:3; width:42px; height:42px; border-radius:50%;
  background:rgba(0,0,0,.5); font-size:20px; color:#fff; display:flex; align-items:center; justify-content:center;
}
.detail-backdrop .back-btn:hover{ background:rgba(0,0,0,.75); }
.detail-head{ position:relative; z-index:2; padding:0 3vw 24px; width:100%; }
.detail-title{ font-size:clamp(26px,3.5vw,44px); font-weight:900; margin-bottom:10px; }
.detail-meta{ display:flex; gap:14px; flex-wrap:wrap; color:#e5e5e5; font-size:14px; margin-bottom:12px; align-items:center; }
.detail-meta .year{ border:1px solid rgba(255,255,255,.5); padding:1px 8px; border-radius:4px; }
.detail-body{ padding:20px 3vw 40px; }
.detail-genres{ display:flex; gap:8px; flex-wrap:wrap; margin-bottom:16px; }
.chip{ background:var(--bg3); padding:4px 12px; border-radius:16px; font-size:13px; color:#e5e5e5; }
.detail-overview{ color:#d2d2d2; font-size:15px; line-height:1.8; margin-bottom:16px; }
.detail-cast{ color:#e5e5e5; font-size:14px; line-height:1.7; margin-bottom:20px; }
.detail-cast b{ color:#fff; }
.detail-actions{ display:flex; gap:12px; flex-wrap:wrap; margin-bottom:26px; }
.source-box{ background:var(--bg2); border-radius:10px; padding:16px; margin-top:6px; }
.source-box h4{ font-size:14px; margin-bottom:10px; color:#e5e5e5; }
.source-box input{ width:100%; padding:10px 12px; border-radius:6px; border:1px solid #444; background:#111; color:#fff; font-size:14px; outline:none; }
.source-box input:focus{ border-color:var(--red); }
.source-box .row-btns{ display:flex; gap:10px; margin-top:10px; flex-wrap:wrap; }

/* ============ 播放器 ============ */
#playerOverlay{ position:fixed; inset:0; z-index:300; background:#000; display:none; flex-direction:column; }
#playerOverlay.open{ display:flex; }
#playerTop{
  position:absolute; top:0; left:0; right:0; z-index:10; display:flex; align-items:center; gap:14px;
  padding:16px 20px; background:linear-gradient(180deg, rgba(0,0,0,.85), transparent);
}
#playerTop .back-btn{ width:42px; height:42px; border-radius:50%; background:rgba(0,0,0,.5); font-size:20px; color:#fff; }
#playerTop .p-title{ font-size:17px; font-weight:700; }
#playerTop .p-meta{ font-size:12px; color:var(--muted); margin-top:2px; }
#playerWrap{ flex:1; display:flex; align-items:center; justify-content:center; position:relative; }
#playerVideo{ width:100%; height:100%; max-width:100vw; max-height:100vh; background:#000; outline:none; }
#playerControls{
  position:absolute; bottom:0; left:0; right:0; z-index:10; padding:30px 20px 16px;
  background:linear-gradient(0deg, rgba(0,0,0,.85), transparent);
  display:flex; align-items:center; gap:14px; transition:opacity .3s;
}
#playerControls.hidden{ opacity:0; pointer-events:none; }
#playerSeek{ flex:1; height:4px; -webkit-appearance:none; appearance:none; background:#444; border-radius:2px; outline:none; }
#playerSeek::-webkit-slider-thumb{ -webkit-appearance:none; width:14px; height:14px; border-radius:50%; background:var(--red); cursor:pointer; }
#playerTime{ font-size:13px; color:#e5e5e5; white-space:nowrap; }
.quality-hint{ font-size:12px; color:var(--muted); white-space:nowrap; }

/* ============ 设置弹层 ============ */
#settingsOverlay{ position:fixed; inset:0; z-index:250; background:rgba(0,0,0,.7); display:none; align-items:center; justify-content:center; padding:20px; }
#settingsOverlay.open{ display:flex; }
#settingsBox{ background:#181818; border-radius:14px; width:100%; max-width:520px; padding:26px; box-shadow:0 20px 60px rgba(0,0,0,.7); max-height:85vh; overflow-y:auto; }
#settingsBox h2{ font-size:20px; margin-bottom:18px; display:flex; align-items:center; justify-content:space-between; }
#settingsBox h2 .close{ font-size:22px; color:#999; cursor:pointer; }
.setting-field{ margin-bottom:18px; }
.setting-field label{ display:block; font-size:13px; color:var(--muted); margin-bottom:8px; }
.setting-field input, .setting-field select{ width:100%; padding:10px 12px; border-radius:6px; border:1px solid #444; background:#111; color:#fff; font-size:14px; outline:none; }
.setting-field input:focus{ border-color:var(--red); }
.setting-note{ font-size:12px; color:#888; line-height:1.7; margin-top:6px; }
.mode-badge{ display:inline-block; font-size:12px; padding:3px 10px; border-radius:12px; margin-bottom:10px; }
.mode-tmdb{ background:rgba(1,180,228,.18); color:#01b4e4; }
.mode-demo{ background:rgba(245,197,24,.15); color:var(--star); }
#modeNotice{ text-align:center; color:var(--muted); font-size:13px; padding:10px 0 4px; }

/* ============ 页脚 ============ */
footer{ text-align:center; color:#666; font-size:12px; padding:36px 20px 20px; }

/* ============ 下载 / 离线缓存（新增模块） ============ */
/* 进度条容器与进度条 */
.progress-wrap{ background:var(--bg2); border-radius:10px; padding:14px 16px; margin-top:14px; }
.progress-head{ display:flex; align-items:center; justify-content:space-between; font-size:13px; color:#e5e5e5; margin-bottom:10px; }
.progress-bar{ height:6px; background:#333; border-radius:3px; overflow:hidden; }
.progress-fill{ height:100%; width:0%; background:var(--red); border-radius:3px; transition:width .25s; }
.progress-pct{ font-weight:700; color:var(--red); }
.progress-cancel{ padding:4px 14px; border-radius:6px; background:rgba(255,255,255,.14); color:#fff; font-size:12px; }
.progress-cancel:hover{ background:rgba(255,255,255,.25); }
/* 缓存列表条目 */
.cache-item{
  display:flex; align-items:center; gap:14px; background:var(--bg2); border-radius:10px;
  padding:14px 16px; margin-bottom:12px; flex-wrap:wrap;
}
.cache-poster{ width:56px; aspect-ratio:2/3; border-radius:6px; background-size:cover; background-position:center; flex:0 0 auto; }
.cache-info{ flex:1; min-width:140px; }
.cache-title{ font-size:15px; font-weight:700; margin-bottom:4px; }
.cache-meta{ font-size:12px; color:var(--muted); }
.cache-actions{ display:flex; gap:10px; flex-wrap:wrap; }
.cache-actions .btn{ padding:8px 18px; font-size:13px; }
.btn-gray{ background:#3a3f4a; color:#e8e8e8; }
.btn-gray:hover{ background:#4a505c; }
.btn-sm{ padding:6px 12px; font-size:13px; }
.progress-text.err{ color:#ff6b6b; }

/* ============ 响应式：手机端 ============ */
@media (max-width:768px){
  .nav, #searchBox{ display:none; }
  #hamburger{ display:block; }
  .row-scroll .card{ width:124px; }
  .hero{ height:56vh; min-height:340px; }
  .hero-inner{ padding-bottom:36px; }
  .hero-overview{ display:none; }
  .btn{ padding:8px 18px; font-size:14px; }
  .detail-backdrop{ height:38vh; }
  #tvHint{ display:none; }
}
/* 电视大屏：焦点明显 */
@media (min-width:1400px){
  html{ font-size:18px; }
  .row-scroll .card{ width:220px; }
  .grid{ grid-template-columns:repeat(auto-fill, minmax(200px,1fr)); }
  .card .card-title{ font-size:17px; }
  .card .card-sub{ font-size:14px; }
  .nav button{ font-size:18px; padding:10px 18px; }
}
</style>
</head>
<body>

<!-- ============ 顶部导航 ============ -->
<header id="topbar">
  <div class="logo" data-nav="home" tabindex="0">Marvis<span> Cinema</span></div>
  <button id="hamburger" aria-label="菜单">☰</button>
  <nav class="nav" id="mainNav">
    <button class="nav-item active" data-nav="home">首页</button>
    <button class="nav-item" data-nav="movies">电影</button>
    <button class="nav-item" data-nav="tv">电视剧</button>
    <button class="nav-item" data-nav="favorites">我的收藏</button>
    <button class="nav-item" data-nav="cache">我的缓存</button>
  </nav>
  <div id="searchBox">
    <input id="searchInput" type="text" placeholder="搜索电影 / 电视剧..." autocomplete="off">
    <button id="searchBtn" aria-label="搜索">🔍</button>
  </div>
  <button id="settingsBtn" aria-label="设置">⚙</button>
</header>
<nav id="mobileNav">
  <button data-nav="home">首页</button>
  <button data-nav="movies">电影</button>
  <button data-nav="tv">电视剧</button>
  <button data-nav="favorites">我的收藏</button>
  <button data-nav="cache">我的缓存</button>
</nav>

<!-- 电视端提示条 -->
<div id="tvHint" style="display:none;">
  <span>📺 电视端提示：请用遥控器方向键 + OK 键操作</span>
  <button class="close" id="tvHintClose">✕</button>
</div>

<!-- ============ 首页 ============ -->
<section id="page-home" class="page active">
  <div id="heroArea"></div>
  <div id="homeRows">
    <div id="rowLatest"></div>
    <div id="rowTop"></div>
    <div id="rowMovies"></div>
    <div id="rowTv"></div>
  </div>
</section>

<!-- ============ 电影页 ============ -->
<section id="page-movies" class="page">
  <div class="container">
    <h2 class="section-title">电影</h2>
    <div id="moviesGrid" class="grid"></div>
  </div>
</section>

<!-- ============ 电视剧页 ============ -->
<section id="page-tv" class="page">
  <div class="container">
    <h2 class="section-title">电视剧</h2>
    <div id="tvGrid" class="grid"></div>
  </div>
</section>

<!-- ============ 我的收藏页 ============ -->
<section id="page-favorites" class="page">
  <div class="container">
    <h2 class="section-title">我的收藏</h2>
    <div id="favGrid" class="grid"></div>
  </div>
</section>

<!-- ============ 我的缓存页（离线缓存） ============ -->
<section id="page-cache" class="page">
  <div class="container">
    <h2 class="section-title">我的缓存</h2>
    <div id="cacheStat" class="search-stat"></div>
    <div id="cacheList"></div>
  </div>
</section>

<!-- ============ 搜索页 ============ -->
<section id="page-search" class="page">
  <div class="container">
    <h2 class="section-title" id="searchTitle">搜索结果</h2>
    <div class="search-stat" id="searchStat"></div>
    <div id="searchGrid" class="grid"></div>
  </div>
</section>

<!-- ============ 详情弹层 ============ -->
<div id="detailOverlay"><div id="detailBox"></div></div>

<!-- ============ 播放器 ============ -->
<div id="playerOverlay">
  <div id="playerTop">
    <button class="back-btn" id="playerBack">←</button>
    <div>
      <div class="p-title" id="playerTitle"></div>
      <div class="p-meta" id="playerMeta"></div>
    </div>
  </div>
  <div id="playerWrap">
    <video id="playerVideo" controls autoplay playsinline></video>
    <div id="playerProgress"></div>
    <div id="playerControls">
      <button class="btn btn-red" id="playerPlayPause">暂停</button>
      <input type="range" id="playerSeek" min="0" max="1000" value="0">
      <span id="playerTime">0:00 / 0:00</span>

/* ---------- 3. 状态管理 ---------- */
const LS_KEY = "marvis_tmdb_key", LS_FAV = "marvis_favorites", LS_HINT = "marvis_tv_hint";
let tmdbKey = localStorage.getItem(LS_KEY) || "";
let favorites = JSON.parse(localStorage.getItem(LS_FAV) || "[]");
let currentMode = "demo";          // demo | tmdb
let tmdbMovies = [], tmdbTv = [];  // TMDB 缓存
let allDemo = DEMO_DATA;
let detailItem = null;             // 当前详情条目
let currentSearch = "";

function isDemo(){ return currentMode === "demo" || IS_PREVIEW; }
function favKey(it){ return it.type + "-" + it.id; }
function isFav(it){ return favorites.indexOf(favKey(it)) > -1; }
function toggleFav(it){
  const k = favKey(it);
  const i = favorites.indexOf(k);
  if(i > -1){ favorites.splice(i,1); } else { favorites.push(k); }
  localStorage.setItem(LS_FAV, JSON.stringify(favorites));
  refreshFavButtons();
  if(document.getElementById("page-favorites").classList.contains("active")) renderFavorites();
}
function getModeTitle(){ return currentMode === "tmdb" ? "TMDB" : "演示"; }

/* ---------- 工具：图片地址 / 占位 ---------- */
function posterOf(it){
  if(it.poster_path) return TMDB_IMG + POSTER_W + it.poster_path;
  if(it.poster) return it.poster;
  return null; // 渐变占位
}
function backdropOf(it){
  if(it.backdrop_path) return TMDB_IMG + BACKDROP_W + it.backdrop_path;
  if(it.backdrop) return it.backdrop;
  return posterOf(it);
}

/* ---------- 4. TMDB 数据获取 ---------- */
async function tmdbFetch(path){
  const r = await fetch(TMDB_API + path + (path.indexOf("?")>-1?"&":"?") + "api_key=" + encodeURIComponent(tmdbKey) + "&language=zh-CN&region=CN");
  if(!r.ok) throw new Error("TMDB HTTP " + r.status);
  return r.json();
}
// 演示模式数据统一结构：兼容 TMDB 字段（poster_path/backdrop_path/name）
function toItem(o, type){
  return {
    id: o.id, type: type,
    title: o.title || o.name || o.original_title || "",
    year: parseInt(o.release_date || o.first_air_date || "0", 10) || 0,
    rating: o.vote_average || 0,
    genres: (o.genres || []).map(g => g.name),
    overview: o.overview || "",
    cast: (o.credits && o.credits.cast ? o.credits.cast.slice(0,8).map(c=>c.name) : []),
    poster_path: o.poster_path || null,
    backdrop_path: o.backdrop_path || null,
    videoUrl: TEST_STREAMS[Math.abs((o.id||0)) % TEST_STREAMS.length]
  };
}
async function loadTMDBMovies(){
  const j = await tmdbFetch("/discover/movie?sort_by=primary_release_date.desc&include_adult=false&page=1");
  return (j.results || []).map(o => toItem(o, "movie"));
}
async function loadTMDBTv(){
  const j = await tmdbFetch("/discover/tv?sort_by=first_air_date.desc&include_adult=false&page=1");
  return (j.results || []).map(o => toItem(o, "tv"));
}
async function searchTMDB(q){
  const j = await tmdbFetch("/search/multi?query=" + encodeURIComponent(q) + "&include_adult=false");
  return (j.results || [])
    .filter(o => o.media_type === "movie" || o.media_type === "tv")
    .map(o => toItem(o, o.media_type));
}
// 演示模式本地搜索（按片名关键词）
function searchDemo(q){
  q = q.toLowerCase();
  return allDemo.filter(it => it.title.toLowerCase().indexOf(q) > -1);
}

/* ---------- 5. UI 渲染 ---------- */
function el(html){ const d=document.createElement("div"); d.innerHTML=html.trim(); return d.firstChild; }
function stars(r){ return r ? "★ " + Number(r).toFixed(1) : ""; }

// 卡片 HTML（isRow: 横向行样式；grid 用 .grid .card 覆盖宽度）
function cardHTML(it, opts){
  opts = opts || {};
  const img = posterOf(it);
  const posterBg = img ? "background:" + gradientFor(it.title) : "background:" + gradientFor(it.title);
  const grad = '<div class="grad-ph">' + it.title.charAt(0) + '</div>';
  const imgTag = img ? '<img class="poster-img" src="' + img + '" alt="" loading="lazy" onerror="this.style.display=\'none\'">' : '';
  const favOn = isFav(it) ? "on" : "";
  const typeBadge = opts.showType ? '<span class="badge-type ' + (it.type==="tv"?"badge-tv":"") + '">' + (it.type==="tv"?"剧":"影") + '</span>' : "";
  return '<div class="card" data-id="' + it.id + '" data-type="' + it.type + '" tabindex="0">'
    + '<div class="poster" style="' + posterBg + '">' + imgTag + grad
    + '<button class="fav ' + favOn + '" data-fav="' + favKey(it) + '" aria-label="收藏">' + (favOn?"♥":"♡") + '</button>'
    + '</div>'
    + '<div class="card-info"><div class="card-title">' + it.title + '</div>'
    + '<div class="card-sub">' + (it.year || "") + ' ' + stars(it.rating) + ' ' + typeBadge + '</div></div>'
    + '</div>';
}

// 渲染横向滚动行
function renderRow(title, list, id, count){
  const box = document.getElementById(id);
  if(!list || !list.length){ return; }
  box.innerHTML = '<div class="row"><h3 class="row-title">' + title + ' <span class="count">' + (count || list.length) + ' 部</span></h3>'
    + '<div class="row-scroll" data-row="' + id + '">' + list.map(c => cardHTML(c, {showType:true})).join("") + '</div></div>';
}
// 渲染网格
function renderGrid(containerId, list, emptyText){
  const c = document.getElementById(containerId);
  if(!list || !list.length){ c.innerHTML = '<div class="empty">' + (emptyText || "暂无内容") + '</div>'; return; }
  c.innerHTML = list.map(card => cardHTML(card, {showType:true})).join("");
}

// 排序：按年份从新到旧（TMDB 已由 sort_by 保证，演示数据同样保证）
function sortByYearDesc(a,b){ return (b.year||0) - (a.year||0) || (b.rating||0)-(a.rating||0); }

// Hero 渲染
function heroHTML(it){
  const bg = backdropOf(it);
  const bgStyle = bg ? "background-image:url('" + bg + "');background-color:#141414;" : "background:" + gradientFor(it.title) + ";";
  const meta = '<span>' + (it.type==="movie"?"电影":"电视剧") + '</span>'
    + (it.year ? '<span>' + it.year + '</span>' : "")
    + (it.rating ? '<span class="star">' + stars(it.rating) + '</span>' : "");
  return '<div class="hero" style="' + bgStyle + '"><div class="hero-inner">'
    + '<span class="hero-badge">今日推荐</span>'
    + '<h1 class="hero-title">' + it.title + '</h1>'
    + '<div class="hero-meta">' + meta + '</div>'
    + '<p class="hero-overview">' + it.overview + '</p>'
    + '<div class="hero-btns">'
    + '<button class="btn btn-play" data-play="' + favKey(it) + '">▶ 立即播放</button>'
    + '<button class="btn btn-info" data-detail="' + favKey(it) + '">ℹ 详情</button>'
    + '</div></div></div>';
}

// 首页：Hero + 内容行
async function renderHome(){
  const movies = isDemo() ? allDemo.filter(x=>x.type==="movie").slice().sort(sortByYearDesc) : tmdbMovies;
  const tvs    = isDemo() ? allDemo.filter(x=>x.type==="tv").slice().sort(sortByYearDesc) : tmdbTv;
  const heroPick = (movies && movies.length ? movies[0] : (tvs && tvs.length ? tvs[0] : null));
  if(heroPick){ document.getElementById("heroArea").innerHTML = heroHTML(heroPick); }
  const latest = movies.slice().sort(sortByYearDesc).slice(0,14);
  const topRated = movies.concat(tvs).slice().sort((a,b)=>(b.rating||0)-(a.rating||0)).slice(0,14);
  renderRow("🔥 最新上映", latest, "rowLatest", latest.length);
  renderRow("⭐ 高分佳作", topRated, "rowTop", topRated.length);
  renderRow("🎬 电影", movies.slice(0,14), "rowMovies", movies.length);
  renderRow("📺 电视剧", tvs.slice(0,14), "rowTv", tvs.length);
  collectFocusables();
}

/* ---------- 6. 详情弹层 ---------- */
function findItem(type, id){
  if(isDemo()){ return allDemo.find(x => x.type===type && String(x.id)===String(id)); }
  const pool = type === "movie" ? tmdbMovies : tmdbTv;
  return pool.find(x => String(x.id) === String(id));
}
function openDetail(it){
  detailItem = it;
  const bg = backdropOf(it);
  const bgStyle = bg ? "background:" + gradientFor(it.title) + ";" : "background:" + gradientFor(it.title) + ";";
  const bgImg = bg ? '<img class="backdrop-img" src="' + bg + '" alt="" onerror="this.style.display=\'none\'">' : '';
  const castHtml = it.cast && it.cast.length ? '<div class="detail-cast"><b>演员：</b>' + it.cast.join(" / ") + '</div>' : "";
  const genresHtml = (it.genres && it.genres.length) ? '<div class="detail-genres">' + it.genres.map(g=>'<span class="chip">'+g+'</span>').join("") + '</div>' : "";
  document.getElementById("detailBox").innerHTML =
    '<div class="detail-backdrop" style="' + bgStyle + '">'
    + bgImg
    + '<button class="back-btn" id="detailClose">←</button>'
    + '<div class="detail-head">'
    + '<h2 class="detail-title">' + it.title + '</h2>'
    + '<div class="detail-meta">'
    + '<span class="year">' + (it.year || "未知") + '</span>'
    + '<span>' + (it.type==="movie"?"电影":"电视剧") + '</span>'
    + (it.rating ? '<span class="star">' + stars(it.rating) + '</span>' : "")
    + '</div></div></div>'
    + '<div class="detail-body">'
    + genresHtml
    + '<p class="detail-overview">' + (it.overview || "暂无简介") + '</p>'
    + castHtml
    + '<div class="detail-actions">'

/* ---------- 7. 播放器（原生 video + hls.js） ---------- */
let hls = null;
let __playingItem = null;   // 当前播放条目（供下载/缓存按钮使用）
function openPlayer(it, url){
  if(!url){ alert("请先填写播放地址"); return; }
  closeDetail();
  document.getElementById("playerOverlay").classList.add("open");
  __playingItem = it;
  document.getElementById("playerTitle").textContent = it.title;
  document.getElementById("playerMeta").textContent = (it.type==="movie"?"电影":"电视剧") + " · " + (it.year||"") + " · " + stars(it.rating);
  const video = document.getElementById("playerVideo");
  // 清理旧的 HLS 实例
  if(hls){ hls.destroy(); hls = null; }
  video.pause();
  video.removeAttribute("src");
  video.load();
  // 若传入的是 objectURL（缓存播放），直接使用；否则按协议判断
  const isBlob = /^blob:/.test(url);
  const isHls = !isBlob && /\.m3u8(\?|$)/i.test(url);
  if(isHls && window.Hls && Hls.isSupported()){
    hls = new Hls({ maxBufferLength: 30 });
    hls.loadSource(url);
    hls.attachMedia(video);
    hls.on(Hls.Events.MANIFEST_PARSED, function(){ video.play(); });
    hls.on(Hls.Events.ERROR, function(e, data){
      if(data.fatal){
        var tip = document.getElementById("playerQuality");
        tip.textContent = "播放出错：源不可达或跨域受限。可点右上角「源」更换其他地址重试";
        document.getElementById("playerPlayPause").textContent = "重试";
      }
    });
    document.getElementById("playerQuality").textContent = "清晰度：自动（HLS 切片流）";
  } else if(video.canPlayType("application/vnd.apple.mpegurl") && isHls){
    // Safari 原生 HLS
    video.src = url;
    video.play();
    document.getElementById("playerQuality").textContent = "清晰度：自动（原生 HLS）";
  } else {
    video.src = url;
    video.play();
    document.getElementById("playerQuality").textContent = isBlob ? "清晰度：自动（离线缓存）" : "清晰度：自动";
  }
  bindPlayerEvents(video);
  // 播放器内下载 / 缓存按钮（新增模块）
  document.getElementById("playerDownload").onclick = function(){ downloadVideo(it, url, "playerProgress"); };
  document.getElementById("playerCache").onclick = function(){ cacheVideo(it, url, "playerProgress"); };
}
function closePlayer(){
  if(hls){ hls.destroy(); hls = null; }
  const video = document.getElementById("playerVideo");
  video.pause(); video.removeAttribute("src"); video.load();
  // 清理离线缓存播放产生的 objectURL
  if(window.__cacheObjUrl){ URL.revokeObjectURL(window.__cacheObjUrl); window.__cacheObjUrl = null; }
  document.getElementById("playerProgress").innerHTML = "";
  document.getElementById("playerOverlay").classList.remove("open");
  if(detailItem) openDetail(detailItem);
}
function bindPlayerEvents(video){
  const seek = document.getElementById("playerSeek");
  const timeEl = document.getElementById("playerTime");
  const ppBtn = document.getElementById("playerPlayPause");
  video.addEventListener("timeupdate", function(){
    if(video.duration){
      seek.value = video.currentTime / video.duration * 1000;
      timeEl.textContent = fmt(video.currentTime) + " / " + fmt(video.duration);
    }
  });
  video.addEventListener("play", function(){ ppBtn.textContent = "暂停"; });
  video.addEventListener("pause", function(){ ppBtn.textContent = "播放"; });
  seek.addEventListener("input", function(){ if(video.duration) video.currentTime = seek.value/1000 * video.duration; });
  ppBtn.onclick = function(){ video.paused ? video.play() : video.pause(); };
  // 原生 video（MP4 直链）加载失败提示
  video.addEventListener("error", function(){
    if(!hls && video.getAttribute("src")){
      document.getElementById("playerQuality").textContent = "播放出错：地址无法访问。可点右上角「源」更换其他地址重试";
    }
  });
  // 移动设备隐藏自带控件之外：点击画面显隐控制条
  document.getElementById("playerWrap").onclick = function(e){
    if(e.target === video){ document.getElementById("playerControls").classList.toggle("hidden"); }
  };
}
function fmt(s){ s = Math.floor(s||0); const m=Math.floor(s/60), ss=s%60; return m + ":" + (ss<10?"0":"") + ss; }

/* ---------- 11. 电视端遥控焦点管理 ---------- */
// 收集所有可聚焦元素：卡片 / 导航 / 按钮 / Logo
function collectFocusables(){
  const scope = document;
  const list = [];
  scope.querySelectorAll(".card, .nav-item, #settingsBtn, .btn, .fav, .back-btn, #hamburger, .logo, #tvHintClose, #detailClose").forEach(function(x){
    if(x.offsetParent !== null || x.id === "detailClose") list.push(x);
  });
  window.__focusList = list.filter(x => x.style.display !== "none");
}
// 计算元素中心点，方向键按几何最近原则移动焦点
function moveFocus(dx, dy){
  const list = window.__focusList || [];
  if(!list.length){ collectFocusables(); }
  const cur = document.activeElement;
  const from = (cur && cur.getBoundingClientRect) ? cur.getBoundingClientRect() : { left:0, top:0, right:window.innerWidth, bottom:window.innerHeight, width:window.innerWidth, height:window.innerHeight };
  const cx = (from.left + from.right) / 2, cy = (from.top + from.bottom) / 2;
  let best = null, bestScore = Infinity;
  list.forEach(function(n){
    if(n === cur || n === document.activeElement) return;
    const r = n.getBoundingClientRect();
    const nx = (r.left + r.right)/2, ny = (r.top + r.bottom)/2;
    const gdx = nx - cx, gdy = ny - cy;
    // 必须朝目标方向移动
    if(dx !== 0 && gdx * dx <= 0) return;
    if(dy !== 0 && gdy * dy <= 0) return;
    const score = gdx*gdx + gdy*gdy;
    if(score < bestScore){ bestScore = score; best = n; }
  });
  if(best){ best.focus(); scrollIntoViewSafe(best); return true; }
  return false;
}
function scrollIntoViewSafe(node){
  if(node.scrollIntoView){ try{ node.scrollIntoView({ block:"nearest", inline:"nearest", behavior:"smooth" }); }catch(e){ node.scrollIntoView(); } }
}
document.addEventListener("keydown", function(e){
  // 输入框内不劫持方向键（电视端搜索时可忽略）
  if(document.activeElement && (document.activeElement.tagName === "INPUT" || document.activeElement.tagName === "TEXTAREA")) return;
  const k = e.key;
  const overlayOpen = document.getElementById("detailOverlay").classList.contains("open")
    || document.getElementById("settingsOverlay").classList.contains("open")
    || document.getElementById("playerOverlay").classList.contains("open");
  if(k === "ArrowUp"){ e.preventDefault(); moveFocus(0,-1); }
  else if(k === "ArrowDown"){ e.preventDefault(); moveFocus(0,1); }
  else if(k === "ArrowLeft"){
    e.preventDefault();
    const row = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".row-scroll") : null;
    if(row){ row.scrollBy({ left:-260, behavior:"smooth" }); }
    else if(!moveFocus(-1,0)){ /* 边界 */ }
  }
  else if(k === "ArrowRight"){
    e.preventDefault();
    const row = document.activeElement && document.activeElement.closest ? document.activeElement.closest(".row-scroll") : null;
    if(row){ row.scrollBy({ left:260, behavior:"smooth" }); }
    else if(!moveFocus(1,0)){ /* 边界 */ }
  }
  else if(k === "Enter" || k === " "){
    const a = document.activeElement;
    if(a && a.tagName === "BUTTON" && !overlayOpen){ e.preventDefault(); a.click(); }
    else if(a && a.classList && a.classList.contains("card")){ e.preventDefault(); openCard(a); }
  }
  else if(k === "Escape"){
    if(document.getElementById("playerOverlay").classList.contains("open")) closePlayer();
    else if(document.getElementById("detailOverlay").classList.contains("open")) closeDetail();
    else if(document.getElementById("settingsOverlay").classList.contains("open")) closeSettings();
  }
  else if(k === "Backspace" && overlayOpen){ e.preventDefault(); document.getElementById("playerOverlay").classList.contains("open") ? closePlayer() : (document.getElementById("detailOverlay").classList.contains("open") ? closeDetail() : closeSettings()); }
});

/* ==================== 新增模块：下载 / 离线缓存 ==================== */
/* ---------- 12A. 下载到本地文件 ---------- */
var currentPage = "home";   // 当前所在页面（缓存完成后刷新列表用）
function esc(s){ return String(s == null ? "" : s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;").replace(/'/g,"&#39;"); }
function escAttr(s){ return esc(s); }
function fmtSize(b){ if(b<1024) return b+" B"; if(b<1048576) return (b/1024).toFixed(1)+" KB"; return (b/1048576).toFixed(1)+" MB"; }
function fmtTime(t){ const d = new Date(t); return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,'0') + "-" + String(d.getDate()).padStart(2,'0') + " " + String(d.getHours()).padStart(2,'0') + ":" + String(d.getMinutes()).padStart(2,'0'); }
// 下载：fetch Blob + a[download]；m3u8 或 CORS 失败给出提示
function downloadVideo(item, url, progressId){
  if(/\.m3u8(\?|$)/i.test(url)){ alert("m3u8 为切片流，不支持直接下载完整视频，请复制地址到下载工具"); return; }
  const c = document.getElementById(progressId);
  const dom = '<div class="progress-wrap"><div class="progress-bar"><i></i></div><div class="progress-text">正在下载 ' + esc(item.title) + '…</div></div>';
  c.innerHTML = dom;
  const bar = c.querySelector(".progress-bar i"), txt = c.querySelector(".progress-text");
  fetch(url).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    const total = parseInt(r.headers.get("Content-Length") || "0", 10);
    const reader = r.body.getReader();
    const chunks = []; let got = 0;
    function pump(){
      return reader.read().then(function(res){
        if(res.done){
          const blob = new Blob(chunks);
          const a = document.createElement("a");
          a.href = URL.createObjectURL(blob);
          const ext = (url.split("?")[0].match(/\.(mp4|webm|mov|mkv)(\?|$)/i) || [,"mp4"])[1];
          a.download = item.title.replace(/[\\/:*?"<>|]/g, "_") + "." + ext;
          document.body.appendChild(a); a.click(); a.remove();
          setTimeout(function(){ URL.revokeObjectURL(a.href); }, 5000);
          c.innerHTML = '<div class="progress-text">✅ 下载完成：' + esc(item.title) + '</div>';
          return;
        }
        chunks.push(res.value); got += res.value.length;
        if(total){ const p = Math.min(100, Math.round(got / total * 100)); bar.style.width = p + "%"; txt.textContent = "正在下载 " + esc(item.title) + "… " + p + "% (" + fmtSize(got) + " / " + fmtSize(total) + ")"; }
        else { txt.textContent = "正在下载 " + esc(item.title) + "… " + fmtSize(got); }
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    // CORS / 跨域 / 网络错误：引导复制地址
    c.innerHTML = '<div class="progress-text err">该源不支持浏览器直接下载，请复制地址到下载工具</div>';
  });
}

/* ---------- 12B. 离线缓存（IndexedDB: mc_cache） ---------- */
const DB_NAME = "mc_cache", DB_VER = 1, STORE = "cache";
function openDB(){
  return new Promise(function(resolve, reject){
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = function(e){
      const db = e.target.result;
      if(!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE, { keyPath: "url" });
    };
    req.onsuccess = function(){ resolve(req.result); };
    req.onerror = function(){ reject(req.error); };
  });
}
// 缓存：fetch 直链 → Blob → IndexedDB；带进度条与取消；m3u8 提示暂不支持
let cacheAbort = null;
function cacheVideo(item, url, progressId){
  if(/\.m3u8(\?|$)/i.test(url)){ alert("m3u8 流暂不支持离线缓存，可用下载按钮获取源文件"); return; }
  const c = document.getElementById(progressId);
  const dom = '<div class="progress-wrap"><div class="progress-bar"><i></i></div><div class="progress-text">正在缓存 ' + esc(item.title) + '…</div><button class="btn btn-gray" id="cacheCancel">取消</button></div>';
  c.innerHTML = dom;
  const bar = c.querySelector(".progress-bar i"), txt = c.querySelector(".progress-text");
  const ac = new AbortController(); cacheAbort = ac;
  c.querySelector("#cacheCancel").onclick = function(){ ac.abort(); };
  fetch(url, { signal: ac.signal }).then(function(r){
    if(!r.ok) throw new Error("HTTP " + r.status);
    const total = parseInt(r.headers.get("Content-Length") || "0", 10);
    const reader = r.body.getReader();
    const chunks = []; let got = 0;
    function pump(){
      return reader.read().then(function(res){
        if(res.done){
          const blob = new Blob(chunks, { type: r.headers.get("Content-Type") || "video/mp4" });
          return openDB().then(function(db){
            return new Promise(function(resolve, reject){
              const tx = db.transaction(STORE, "readwrite");
              tx.objectStore(STORE).put({ url: url, title: item.title, type: item.type || "movie", poster: item.poster || "", size: blob.size, time: Date.now(), blob: blob });
              tx.oncomplete = function(){ resolve(); };
              tx.onerror = function(){ reject(tx.error); };
              tx.onabort = function(){ reject(tx.error); };
            });
          }).then(function(){
            c.innerHTML = '<div class="progress-text">✅ 已缓存：' + esc(item.title) + '，可在「我的缓存」离线播放</div>';
            if(currentPage === "cache") renderCacheList();
          });
        }
        chunks.push(res.value); got += res.value.length;
        if(total){ const p = Math.min(100, Math.round(got / total * 100)); bar.style.width = p + "%"; txt.textContent = "正在缓存 " + esc(item.title) + "… " + p + "% (" + fmtSize(got) + " / " + fmtSize(total) + ")"; }
        else { txt.textContent = "正在缓存 " + esc(item.title) + "… " + fmtSize(got); }
        return pump();
      });
    }
    return pump();
  }).catch(function(e){
    if(e && e.name === "AbortError"){ c.innerHTML = '<div class="progress-text">已取消缓存</div>'; return; }
    if(e && e.name === "QuotaExceededError"){ c.innerHTML = '<div class="progress-text err">存储空间不足，请删除部分缓存</div>'; return; }
    c.innerHTML = '<div class="progress-text err">缓存失败（可能跨域受限或网络异常）：' + esc(e.message) + '</div>';
  }).finally(function(){ if(cacheAbort === ac) cacheAbort = null; });
}
// 读缓存列表并渲染「我的缓存」页
async function renderCacheList(){
  const stat = document.getElementById("cacheStat"), list = document.getElementById("cacheList");
  try{
    const db = await openDB();
    const all = await new Promise(function(resolve, reject){
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).getAll();
      req.onsuccess = function(){ resolve(req.result || []); };
      req.onerror = function(){ reject(req.error); };
    });
    const total = all.reduce(function(s, x){ return s + (x.size || 0); }, 0);
    stat.textContent = "共 " + all.length + " 条缓存 · " + fmtSize(total);
    if(!all.length){ list.innerHTML = '<div class="empty">还没有离线缓存，去详情页点「📦 缓存」吧</div>'; return; }
    all.sort(function(a, b){ return b.time - a.time; });
    list.innerHTML = all.map(function(x){
      return '<div class="cache-item">'
        + '<div class="cache-poster"><img src="' + escAttr(x.poster || "") + '" alt="" onerror="this.style.display=\'none\'"></div>'
        + '<div class="cache-info"><div class="cache-title">' + esc(x.title) + '</div>'
        + '<div class="cache-meta">' + fmtSize(x.size) + ' · ' + fmtTime(x.time) + '</div></div>'
        + '<div class="cache-actions">'
        + '<button class="btn btn-play btn-sm" data-cache-play="' + escAttr(x.url) + '">▶ 播放</button>'
        + '<button class="btn btn-gray btn-sm" data-cache-del="' + escAttr(x.url) + '">🗑 删除</button>'
        + '</div></div>';
    }).join("");
    // 播放 / 删除
    list.querySelectorAll("[data-cache-play]").forEach(function(b){
      b.onclick = function(){ playCached(b.getAttribute("data-cache-play")); };
    });
    list.querySelectorAll("[data-cache-del]").forEach(function(b){
      b.onclick = function(){ removeCached(b.getAttribute("data-cache-del"), b); };
    });
    collectFocusables();
  }catch(e){
    stat.textContent = "缓存读取失败：" + e.message;
  }
}
// 从 IndexedDB 读 Blob → objectURL → 交给现有播放器
async function playCached(url){
  try{
    const db = await openDB();
    const rec = await new Promise(function(resolve, reject){
      const tx = db.transaction(STORE, "readonly");
      const req = tx.objectStore(STORE).get(url);
      req.onsuccess = function(){ resolve(req.result); };
      req.onerror = function(){ reject(req.error); };
    });
    if(!rec){ alert("缓存记录不存在"); return; }
    if(window.__cacheObjUrl) URL.revokeObjectURL(window.__cacheObjUrl);
    window.__cacheObjUrl = URL.createObjectURL(rec.blob);
    openPlayer({ title: rec.title, type: rec.type, year: "", rating: 0, poster: rec.poster || "", videoUrl: rec.url }, window.__cacheObjUrl);
  }catch(e){ alert("播放缓存失败：" + e.message); }
}
// 删除缓存：二次确认
async function removeCached(url, btn){
  if(!confirm("确认删除该离线缓存？")) return;
  try{
    const db = await openDB();
    await new Promise(function(resolve, reject){
      const tx = db.transaction(STORE, "readwrite");
      tx.objectStore(STORE).delete(url);
      tx.oncomplete = function(){ resolve(); };
      tx.onerror = function(){ reject(tx.error); };
    });
    renderCacheList();
  }catch(e){ alert("删除失败：" + e.message); }
}

/* ---------- 13. 初始化 ---------- */
async function init(){
  bindEvents(); // 绑定导航/搜索/设置等事件（DOM 已就绪）
  // 设置模式：有 Key 用 TMDB，无 Key 演示
  currentMode = tmdbKey ? "tmdb" : "demo";
  applyMode();
  // 电视端提示条：宽屏且有遥控器场景显示一次
  if(window.innerWidth >= 1024 && !localStorage.getItem(LS_HINT)){
    document.getElementById("tvHint").style.display = "flex";
  }
  await refreshAll();
  collectFocusables();
  // 截图模式：确保内容渲染完成
  if(IS_PREVIEW){
    document.body.classList.add("preview");
    try{
      if(allDemo && allDemo.length) openDetail(allDemo[0]);
      var dl0 = document.getElementById("detailOverlay");
      if(dl0) dl0.setAttribute("data-open", dl0.classList.contains("open") ? "yes" : "no");
    }catch(err){
      var b0 = document.createElement("div");
      b0.style.cssText = "position:fixed;left:0;top:0;z-index:99999;color:#0f0;background:#000;font-size:20px;padding:10px";
      b0.textContent = "ERR:" + (err && err.message);
      document.body.appendChild(b0);
    }
  }
}
document.addEventListener("DOMContentLoaded", init);
